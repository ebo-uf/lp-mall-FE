name: CI/CD - Build & Push Frontend to Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-push:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        run: |
          docker build \
            --build-arg VITE_TOSS_CLIENT_KEY=${{ secrets.VITE_TOSS_CLIENT_KEY }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/lp-frontend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/lp-frontend:latest

  # ── Job 3: EC2 배포 ──────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            DOCKERHUB_USER=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f /app/lp-mall/docker-compose.prod.yml pull frontend
            DOCKERHUB_USER=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f /app/lp-mall/docker-compose.prod.yml up -d frontend
            docker image prune -f
